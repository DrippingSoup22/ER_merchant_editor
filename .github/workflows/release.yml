name: Release

# The Windows GUI cross-compiles with plain Go; the Linux GUI is built
# natively with Gio's X11/Wayland dependencies. No Windows runner, Python,
# or PyInstaller is needed. See docs/PACKAGING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libgles2-mesa-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev \
            libvulkan-dev

      - name: Vet and test
        # Tests needing the (gitignored) fixture save self-skip.
        run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build (Windows and Linux GUIs + shopwrite CLI)
        run: bash app/build.sh

      - name: Upload build artifact (manual runs, no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ERMerchantEditor-linux-and-windows
          path: |
            app/dist/ERMerchantEditor-windows-amd64.exe
            app/dist/ERMerchantEditor-linux-amd64
            app/dist/io.github.daniele.ERMerchantEditor.desktop
            app/dist/io.github.daniele.ERMerchantEditor.png
            app/dist/install-linux-desktop.sh
          if-no-files-found: error

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: "ER Merchant Editor ${{ github.ref_name }}"
          files: |
            app/dist/ERMerchantEditor-windows-amd64.exe
            app/dist/ERMerchantEditor-linux-amd64
            app/dist/io.github.daniele.ERMerchantEditor.desktop
            app/dist/io.github.daniele.ERMerchantEditor.png
            app/dist/install-linux-desktop.sh
