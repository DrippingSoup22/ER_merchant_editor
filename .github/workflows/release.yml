name: Release

# The whole app is pure Go (no cgo on the Windows target), so an
# ubuntu-latest runner cross-compiles the Windows exe with a plain
# `go build` -- no Windows runner, no Python, no PyInstaller. See
# docs/PACKAGING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet and test
        # The GUI's native-Linux target needs X11/Wayland cgo dev packages
        # (dev-only; the shipped exe is the CGO-free Windows target), so the
        # full tree is vetted under GOOS=windows and tests run on the pure-Go
        # packages. Tests needing the (gitignored) fixture save self-skip.
        run: |
          go test ./app/catalog/... ./app/shopwrite/...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...

      - name: Build (Windows exe + shopwrite CLI, all targets)
        run: bash app/build.sh

      - name: Upload build artifact (manual runs, no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ERMerchantEditor-windows
          path: app/dist/ERMerchantEditor.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: "ER Merchant Editor ${{ github.ref_name }}"
          files: app/dist/ERMerchantEditor.exe
